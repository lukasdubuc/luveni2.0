project_id = "unitqfuetxedmmrvlocu"
# Server-side transparent-PNG pipeline. Called server-to-server (vendor syncs,
# sweep cron, Astra) with the service key or x-cron-key — never an admin JWT —
# and auth is enforced inside via isCronOrService, so keep the gateway off.
[functions.strip-background]
verify_jwt = false
[functions.strip-background-sweep]
verify_jwt = false
[functions.jarvis-google]
verify_jwt = false
# CORS preflight (OPTIONS) requests carry no Authorization header, so the
# gateway's verify_jwt check MUST stay OFF here or the browser preflight fails
# ("preflight response does not have HTTP ok status"). Astra's own admin gate
# (requireAdminCaller) enforces auth inside the function on real POST calls.
[functions.jarvis-brain]
verify_jwt = false
# Public TTS proxy for Astra's voice — called from the browser with the anon
# key only. Preflight carries no JWT, so the gateway check stays off; the
# function itself just relays text to ElevenLabs.
[functions.jarvis-tts]
verify_jwt = false
[functions.discord-bot]
verify_jwt = false
[functions.printful-catalog]
verify_jwt = false
[functions.proxy-image]
verify_jwt = false
# TikTok's OAuth callback GET carries no JWT; POST actions are admin-gated inside.
[functions.tiktok-oauth]
verify_jwt = false
# Callers always carry a JWT (admin, service key, or anon+x-cron-key), so the
# gateway check stays on; fine-grained auth is enforced inside.
[functions.tiktok-post]
verify_jwt = true
# CJ's webhook push carries no JWT; authenticated by the shared secret in the URL.
[functions.cj-webhook]
verify_jwt = false
